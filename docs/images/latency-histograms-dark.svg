<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><title id="title">Where the latency really is: log-scale histograms</title><desc id="desc">Two histograms on a log2 time axis. SpscQueue: 99% of ticks between 16 and 128 ns, with a thin tail up to 1 ms. MutexQueue: two peaks, 27% at 1–2 µs and 47% at 4–8 µs, and a tail reaching 4 ms.</desc><rect x="0.5" y="0.5" width="819" height="539" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><text x="28" y="38" font-size="17" font-weight="600" fill="#ffffff">Where the latency really is: log-scale histograms</text><text x="28" y="61" font-size="13" fill="#c3c2b7">Share of 100,000 ticks per bucket · each bucket is twice as wide as the previous one</text><rect x="28.0" y="82.0" width="10" height="10" rx="2" fill="#3987e5"/><text x="44.0" y="92.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">SpscQueue (lock-free)</text><rect x="207.1" y="82.0" width="10" height="10" rx="2" fill="#d95926"/><text x="223.1" y="92.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">MutexQueue (mutex + condition variable)</text><line x1="92.0" y1="278.5" x2="790.0" y2="278.5" stroke="#383835" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="282.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">0%</text><line x1="92.0" y1="228.5" x2="790.0" y2="228.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="232.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">20%</text><line x1="92.0" y1="178.5" x2="790.0" y2="178.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="182.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">40%</text><line x1="92.0" y1="128.5" x2="790.0" y2="128.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><tex