<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><title id="title">The GIL on Windows: why 1–10 ms switch intervals behave alike</title><desc id="desc">Line chart. Measured p50 latency is 16 µs at 0.1 ms, then about 8 ms for every interval from 1 to 10 ms (half of the 15.6 ms Windows timer tick), then 14.5 ms at 20 ms and 32 ms at 40 ms. A reference line shows half the interval, the value expected if waits were exact.</desc><rect x="0.5" y="0.5" width="819" height="439" rx="12" fill="#1a1a19" stroke="#2c2c2a"/><text x="28" y="38" font-size="17" font-weight="600" fill="#ffffff">The GIL on Windows: why 1–10 ms switch intervals behave alike</text><text x="28" y="61" font-size="13" fill="#c3c2b7">Python pipeline with a spinning producer · p50 handoff latency vs sys.setswitchinterval() · log–log</text><line x1="28.0" y1="88.0" x2="46.0" y2="88.0" stroke="#3987e5" stroke-width="2" stroke-linecap="round"/><text x="52.0" y="92.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">measured p50</text><line x1="154.6" y1="88.0" x2="172.6" y2="88.0" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><text x="178.6" y="92.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">reference: half the switch interval (if the wait were exact)</text><line x1="92.0" y1="380.5" x2="740.0" y2="380.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="384.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">1 µs</text><line x1="92.0" y1="328.5" x2="740.0" y2="328.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="332.8" font-size="11" fill="#898781" text-anchor="end" font-weight="400">10 µs</text><line x1="92.0" y1="277.5" x2="740.0" y2="277.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="281.6" font-size="11" fill="#898781" text-anchor="end" font-weight="400">100 µs</text><line x1="92.0" y1="226.5" x2="740.0" y2="226.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="230.4" font-size="11" fill="#898781" text-anchor="end" font-weight="400">1 ms</text><line x1="92.0" y1="175.5" x2="740.0" y2="175.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="179.2" font-size="11" fill="#898781" text-anchor="end" font-weight="400">10 ms</text><line x1="92.0" y1="124.5" x2="740.0" y2="124.5" stroke="#2c2c2a" stroke-width="1.0" stroke-linecap="butt"/><text x="82.0" y="128.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400">100 ms</text><text x="126.2" y="400.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">0.1 ms</text><text x="347.2" y="400.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">1 ms</text><text x="568.1" y="400.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">10 ms</text><text x="701.1" y="400.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">40 ms</text><text x="416.0" y="422.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">GIL switch interval (sys.setswitchinterval)</text><path d="M92.0,300.9 L740.0,150.8" fill="none" stroke="#898781" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><path d="M347.2,180.5 L413.7,179.7 L501.6,179.8 L568.1,177.9 L634.6,166.9 L701.1,149.2" fill="none" stroke="#3987e5" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><circle cx="126.2" cy="317.8" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="347.2" cy="180.5" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="413.7" cy="179.7" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="501.6" cy="179.8" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="568.1" cy="177.9" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="634.6" cy="166.9" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="701.1" cy="149.2" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="136.2" y="335.8" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">16 µs: a timeout under 1 ms rounds to 0</text><text x="136.2" y="351.8" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">→ the GIL is handed over at once</text><text x="347.2" y="146.2" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">~8 ms plateau = half of the 15.6 ms</text><text x="347.2" y="162.2" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">Windows timer tick</text></svg>
