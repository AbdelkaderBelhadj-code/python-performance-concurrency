<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><title id="title">One tick handoff between two threads, five ways</title><desc id="desc">Dot plot of handoff latency. C++ lock-free: p50 75 ns, p99 116 ns. C++ mutex: 5.3 µs and 59.9 µs. Python with 0.1 ms switch interval: 16.2 µs and 79.6 µs. Python queue.Queue with a sleeping producer: 28 µs and 85.1 µs. Python with a spinning producer that holds the GIL: 9.02 ms and 34.1 ms.</desc><rect x="0.5" y="0.5" width="819" height="419" rx="12" fill="#fcfcfb" stroke="#e6e5e0"/><text x="28" y="38" font-size="17" font-weight="600" fill="#0b0b0b">One tick handoff between two threads, five ways</text><text x="28" y="61" font-size="13" fill="#52514e">Same pipeline in C++ and Python · dot = p50 (typical), ring = p99 · log scale, lower is better</text><circle cx="33.0" cy="88.0" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="44.0" y="92.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">C++</text><circle cx="91.2" cy="88.0" r="4.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="102.2" y="92.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Python</text><circle cx="169.5" cy="88.0" r="4.5" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/><text x="180.5" y="92.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">p50</text><circle cx="227.6" cy="88.0" r="6.5" fill="#fcfcfb"/><circle cx="227.6" cy="88.0" r="4.0" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="238.6" y="92.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">p99</text><line x1="300.5" y1="124.0" x2="300.5" y2="392.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="butt"/><text x="300.0" y="412.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">10 ns</text><line x1="370.5" y1="124.0" x2="370.5" y2="392.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="butt"/><text x="370.0" y="412.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100 ns</text><line x1="440.5" y1="124.0" x2="440.5" y2="392.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="butt"/><text x="440.0" y="412.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">1 µs</text><line x1="510.5" y1="124.0" x2="510.5" y2="392.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="butt"/><text x="510.0" y="412.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">10 µs</text><line x1="580.5" y1="124.0" x2="580.5" y2="392.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="butt"/><text x="580.0" y="412.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100 µs</text><line x1="650.5" y1="124.0" x2="650.5" y2="392.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="butt"/><text x="650.0" y="412.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">1 ms</text><line x1="720.5" y1="124.0" x2="720.5" y2="392.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="butt"/><text x="720.0" y="412.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">10 ms</text><line x1="790.5" y1="124.0" x2="790.5" y2="392.0" stroke="#e1e0d9" stroke-width="1.0" stroke-linecap="butt"/><text x="790.0" y="412.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100 ms</text><text x="28.0" y="155.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">C++</text><text x="28.0" y="172.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">lock-free SPSC queue</text><line x1="361.3" y1="158.0" x2="374.5" y2="158.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="374.5" cy="158.0" r="6.5" fill="#fcfcfb"/><circle cx="374.5" cy="158.0" r="4.0" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><circle cx="361.3" cy="158.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="351.3" y="162.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">75 ns</text><text x="28.0" y="207.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">C++</text><text x="28.0" y="224.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">mutex + condition variable</text><line x1="490.6" y1="210.0" x2="564.4" y2="210.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="564.4" cy="210.0" r="6.5" fill="#fcfcfb"/><circle cx="564.4" cy="210.0" r="4.0" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><circle cx="490.6" cy="210.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="480.6" y="214.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">5.29 µs</text><text x="28.0" y="259.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Python</text><text x="28.0" y="276.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">spin, 0.1 ms switch interval</text><line x1="524.7" y1="262.0" x2="573.1" y2="262.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="573.1" cy="262.0" r="6.5" fill="#fcfcfb"/><circle cx="573.1" cy="262.0" r="4.0" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="524.7" cy="262.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="514.7" y="266.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">16.2 µs</text><text x="28.0" y="311.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Python</text><text x="28.0" y="328.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">queue.Queue, producer sleeps</text><line x1="541.3" y1="314.0" x2="575.1" y2="314.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="575.1" cy="314.0" r="6.5" fill="#fcfcfb"/><circle cx="575.1" cy="314.0" r="4.0" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="541.3" cy="314.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="531.3" y="318.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">28 µs</text><text x="28.0" y="363.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Python</text><text x="28.0" y="380.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">producer spins (holds the GIL)</text><line x1="716.9" y1="366.0" x2="757.3" y2="366.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="757.3" cy="366.0" r="6.5" fill="#fcfcfb"/><circle cx="757.3" cy="366.0" r="4.0" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><circle cx="716.9" cy="366.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="706.9" y="370.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">9.02 ms</text><line x1="300.0" y1="392.5" x2="790.0" y2="392.5" stroke="#c3c2b7" stroke-width="1.0" stroke-linecap="butt"/></svg>
